<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payments Admin — Transactions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">M-Pesa Transactions (Admin)</h1>
    <p class="mb-4">Secure admin panel using Supabase Auth. Sign in to view transactions.</p>

    <div id="auth" class="mb-4"></div>
    <div class="mb-4">
      <button id="refresh" class="px-4 py-2 bg-blue-600 text-white rounded">Refresh</button>
    </div>
    <div id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
  <script>
    // Fetch public config from server
    const cfgRes = await fetch('/api/config');
    const cfg = await cfgRes.json();
    const SUPABASE_URL = cfg.SUPABASE_URL || '';
    const SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY || '';

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      document.getElementById('auth').innerHTML = '<p class="text-red-500">Supabase not configured. Configure SUPABASE_URL and SUPABASE_ANON_KEY in Vercel env and redeploy.</p>';
    }

    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Simple auth UI
    const authEl = document.getElementById('auth');

    async function renderAuth() {
      const user = supabase.auth.user();
      if (!user) {
        authEl.innerHTML = `
          <div class="max-w-md">
            <input id="email" placeholder="admin@example.com" class="w-full p-2 border rounded mb-2" />
            <button id="signin" class="px-4 py-2 bg-green-600 text-white rounded">Send Sign-In Link</button>
            <p class="text-sm mt-2">Sign-in link will be sent to the email (magic link). Alternatively configure provider-based auth in Supabase.</p>
          </div>
        `;
        document.getElementById('signin').addEventListener('click', async () => {
          const email = document.getElementById('email').value.trim();
          if (!email) return alert('Enter email');
          const { error } = await supabase.auth.signIn({ email });
          if (error) return alert('Error sending sign-in link: ' + error.message);
          alert('Check your email for a sign-in link.');
        });
      } else {
        authEl.innerHTML = `
          <div class="flex items-center space-x-4">
            <div>Signed in: <strong>${user.email}</strong></div>
            <button id="signout" class="px-3 py-1 bg-red-600 text-white rounded">Sign out</button>
          </div>
        `;
        document.getElementById('signout').addEventListener('click', async () => { await supabase.auth.signOut(); renderAuth(); });
      }
    }

    supabase.auth.onAuthStateChange(() => renderAuth());
    renderAuth();

    // Load transactions via the server API (api/mpesa-list) which will read from Supabase using the service role key
    const listEl = document.getElementById('list');
    async function load() {
      listEl.innerHTML = '<p>Loading…</p>';
      try {
        const user = supabase.auth.user();
        const headers = {};
        if (user && user.access_token) headers['Authorization'] = 'Bearer ' + user.access_token;
        else headers['x-demo-password'] = 'letmein'; // local/demo fallback
        const res = await fetch('/api/mpesa-list', { headers });
        const data = await res.json();
        if (!data || data.length === 0) { listEl.innerHTML = '<p>No transactions yet</p>'; return; }
        const rows = data.map(r => `
          <tr class="border-b align-top">
            <td class="p-2 align-top">${r.received_at || r.receivedAt || ''}</td>
            <td class="p-2 align-top">${r.summary?.MpesaReceiptNumber || r.summary?.MpesaReceipt || ''}</td>
            <td class="p-2 align-top">${r.summary?.Amount || ''}</td>
            <td class="p-2 align-top">${r.summary?.PhoneNumber || ''}</td>
            <td class="p-2 align-top">${r.summary?.resultCode || ''}</td>
            <td class="p-2 align-top"><pre class="whitespace-pre-wrap text-xs">${JSON.stringify(r.summary, null, 2)}</pre></td>
          </tr>`).join('');
        listEl.innerHTML = `<div class="overflow-auto"><table class="w-full bg-white rounded shadow"><thead class="bg-gray-100"><tr><th class="p-2 text-left">Received</th><th class="p-2 text-left">Receipt</th><th class="p-2 text-left">Amount</th><th class="p-2 text-left">Phone</th><th class="p-2 text-left">Code</th><th class="p-2 text-left">Raw</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      } catch (err) { listEl.innerHTML = '<p class="text-red-500">Error loading transactions</p>'; }
    }
    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
